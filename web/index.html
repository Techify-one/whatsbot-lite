<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsBot-Lite</title>
  <meta name="theme-color" content="#008069">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WhatsBot-Lite">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <script type="module" src="/static/js/pwa.js"></script>
  <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme. -->
  <script>try{if(localStorage.getItem('whatsbot_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/custom.css">
  <!-- Prebuilt utility CSS (tools/css). Placed after custom.css on purpose: the
       old in-browser runtime appended its stylesheet last, so it won ties. -->
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <script src="/static/vendor/opus-recorder/recorder.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "preact": "/static/vendor/preact.min.js",
      "preact/hooks": "/static/vendor/preact-hooks.min.js",
      "htm": "/static/vendor/htm.min.js"
    }
  }
  </script>
</head>
<body class="bg-wa-panel text-wa-text h-dvh overflow-hidden overscroll-none">
  <div id="app"></div>
  <script type="module" src="/static/js/app.js"></script>
